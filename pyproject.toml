[project]
name = "transmilenio-ml"
version = "0.1.0"
description = "Aprendizaje supervisado y no supervisado con las salidas del sistema troncal de TransMilenio"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pruebas"]
